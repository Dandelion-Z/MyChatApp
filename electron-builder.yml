electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

# 打包时直接复用 node_modules 中已解压的 Electron（由 npm install 的 electron 包提供，
# 版本与实际依赖一致）。electron-builder 26 默认会重新下载约 125MB 的
# electron-v<version>-win32-x64.zip，网络不稳定时该下载会长时间无进度甚至永久挂起
# （其 fetch 下载器不识别 10 分钟超时、不支持断点续传），表现为“卡在下载 Electron”。
# 指定 electronDist 后完全不联网下载 Electron，直接拷贝本地解压目录。
# 注意：该目录是 Windows 版 Electron，如需构建 mac/linux，请临时删除下面这一行。
electronDist: node_modules/electron/dist

# appId 是 Windows 侧的应用身份：NSIS 用它推导安装注册表键（Software\<GUID>）、
# 卸载项、快捷方式归属与任务栏/AUMID 分组，必须与 src/main/index.ts 的
# setAppUserModelId 保持一致。改动它会得到全新的安装目录与卸载项，
# 旧版本（appId 仍为 com.electron.app）需手动卸载。
appId: com.polarnight.app
productName: polarnight
directories:
  buildResources: build
files:
  # 显式白名单：只打包运行所需的构建产物、依赖与 package.json，
  # 避免把 dist/、.qa/、screenshots/、tsbuildinfo 等开发产物带进安装包
  - 'out/**/*'
  - 'resources/**/*'
  - 'package.json'
  - 'node_modules/**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!server/**'
  - '!database/**'
  - '!**/.env*'
  - '!HANDOFF.md'
  - '!scripts/**'
  - '!docs/**'
  - '!**/.tmp-*/**'
  - '!.tmp-*'
  - '!.qa/**'
  - '!screenshots/**'
  - '!dist/**'
  - '!dist-*/**'
  - '!**/*.tsbuildinfo'
  - '!*.log'
asarUnpack:
  - resources/**
win:
  executableName: polarnight
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  # 关闭一键安装，改为安装向导，允许用户选择安装目录
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 保持 per-user 安装（无需管理员权限，装到用户目录）
  perMachine: false
  # 差分更新：app.asar 以未压缩形式存入安装包，块级差分只下载实际变化的字节
  differentialPackage: store-asar
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  # 正式更新源：GitHub Releases（公开仓库，客户端不内置任何 Token）
  provider: github
  # 必须显式声明 owner/repo：本仓库 .git/config 的 remote 是 polarnight，
  # 省略时会自动探测成错误的仓库名
  owner: Dandelion-Z
  repo: polarnight
  # 公开仓库：不读取 GH_TOKEN/GITHUB_TOKEN，匿名访问即可下载
  private: false
  # tag 使用 v 前缀（v1.0.1），与已发布的 v1.0.0 保持一致
  vPrefixedTagName: true
